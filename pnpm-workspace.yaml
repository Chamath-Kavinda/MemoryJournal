packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install scripts. Everything else stays blocked.
# Skipped on purpose: optional native file watcher, not needed.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  # Skipped on purpose: install script only prepares the optional protobufjs CLI, unused here.
  protobufjs: false
