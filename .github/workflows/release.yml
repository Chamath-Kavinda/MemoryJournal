name: Release

# Pushing a version tag (for example v0.2.0) builds the Android APKs and the
# Windows installer and publishes them on the GitHub Releases page.
#
#   git tag -a v0.2.0 -m "v0.2.0"
#   git push origin main --follow-tags
#
# One-time setup (Settings > Secrets and variables > Actions):
#   Secrets   EXPO_TOKEN (expo.dev > Account settings > Access tokens),
#             EXPO_PUBLIC_FIREBASE_API_KEY, EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN,
#             EXPO_PUBLIC_FIREBASE_PROJECT_ID, EXPO_PUBLIC_FIREBASE_APP_ID,
#             EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID,
#             MJ_GOOGLE_DESKTOP_CLIENT_ID, MJ_GOOGLE_DESKTOP_CLIENT_SECRET

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check tag and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # A tag such as v0.3.0-beta.1 must match 0.3.0-beta.1 in package.json.
          for file in package.json apps/app/package.json apps/desktop/package.json packages/core/package.json; do
            actual="$(node -p "require('./$file').version")"
            if [ "$actual" != "$tag" ]; then
              echo "::error::Tag is v$tag but $file has version $actual."
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  android:
    name: Android APKs (EAS)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds preview and preview-arm64 on EAS, then saves
      # MemoryJournal-v<version>-android.apk and ...-android-arm64.apk.
      - run: pnpm release:android

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/android/*.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_USE_EMULATORS: 'false'
      MJ_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.MJ_GOOGLE_DESKTOP_CLIENT_ID }}
      MJ_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.MJ_GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exports the web app, bundles Electron and runs electron-builder (NSIS).
      - run: pnpm --filter desktop dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/release/*-Setup-*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [check, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Prepare files and checksums
        shell: bash
        working-directory: files
        run: |
          # GitHub turns spaces in asset names into dots, so do it here and the
          # names in SHA256SUMS.txt match what people download.
          for f in *\ *; do
            [ -e "$f" ] && mv "$f" "${f// /.}"
          done
          sha256sum *.apk *.exe > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Write release text
        shell: bash
        run: |
          # Take this version's section from docs/release-notes.md.
          awk -v v="$VERSION" '
            $0 ~ "^## v" v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' docs/release-notes.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release v$VERSION. See docs/release-notes.md." > notes.md
          fi
          {
            cat notes.md
            echo
            echo "## Downloads"
            echo
            echo "- **Android (phones, most devices):** \`MemoryJournal-v$VERSION-android.apk\`"
            echo "- **Android (64-bit only, smaller):** \`MemoryJournal-v$VERSION-android-arm64.apk\`"
            echo "- **Windows:** \`Memory.Journal-Setup-$VERSION.exe\`"
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat files/SHA256SUMS.txt
            echo '```'
          } > body.md

      - name: Create or update the release
        shell: bash
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" files/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file body.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" files/* \
              --verify-tag \
              --title "Memory Journal v$VERSION" \
              --notes-file body.md \
              "${flags[@]}"
          fi
