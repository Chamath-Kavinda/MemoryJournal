appId: com.memoryjournal.desktop
productName: Memory Journal
directories:
  output: release
files:
  - dist/**
  - assets/**
  - package.json
extraResources:
  - from: ../app/dist
    to: web
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
