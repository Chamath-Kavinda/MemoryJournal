appId: com.memoryjournal.desktop
productName: Memory Journal
copyright: Copyright (c) 2026 Chama Bro. All rights reserved.
directories:
  output: release
asar: true
compression: normal
publish: null
files:
  - dist/**
  - assets/**
  - package.json
  - '!dist/**/*.map'
extraResources:
  - from: ../app/dist
    to: web
win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Memory Journal
  license: ../../LICENSE.txt
